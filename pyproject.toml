[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-jarvis"
version = "1.0.0"
description = "JARVIS Multilingual Personal AI Assistant for Windows 11"
authors = [
    {name = "JARVIS Development Team"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.40.0",
    "langdetect>=1.0.9",
]
voice = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.5.0",
    "pyttsx3>=2.90",
    "SpeechRecognition>=3.10.0",
    "openwakeword>=0.6.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
